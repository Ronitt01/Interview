# E7 — fine-tuning arm. Runs last on purpose: it is only worth the compute once
# a frozen encoder has proved the head can separate the classes at all.
# encoder_lr is 100x lower than the head's — one shared LR either cooks the
# pretrained features or starves the head.
run_id: E7
notes: "unfreeze top 2 encoder blocks"
cache_dir: data/cache/train
test_cache_dir: data/cache/test
window_seconds: 1.5
head: linear
freeze_encoder: true
unfreeze_top_blocks: 2
val_fraction: 0.2
group_keys: [dataset]
normalise_mode: peak
use_pos_weight: true
epochs: 8
batch_size: 24
lr: 5.0e-4
encoder_lr: 1.0e-5
weight_decay: 0.01
seed: 1234
fp_cost: 4.0
