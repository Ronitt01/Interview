# E10 — hard-negative oversampling. Closes the one analysis loop that previously
# stopped at diagnosis: scripts/error_analysis.py mined the clips the model was
# most confidently wrong about, and nothing consumed them.
#
# SAFETY, and it is not optional here. Mined indices are positions into one
# specific cache, and error_analysis.py defaults to --cache data/cache/test.
# Oversampling test-cache indices into training would be training on held-out
# data, and the failure is invisible because the indices are just integers.
# So:
#   * mine with --cache data/cache/train --mine-split train
#   * src/dataset.py:load_hard_negatives refuses an index file whose provenance
#     sidecar names a different cache, or a cache of a different size
#   * training additionally intersects the indices with the train split, so even
#     a correctly-mined file cannot pull a validation row across the boundary
#
# `hard_negative_file` points at where run_autonomous.py mines to. Running this
# config by hand requires mining first, or load_hard_negatives raises.
run_id: E10
notes: "hard-negative oversampling — mined on the train split of the train cache"

cache_dir: data/cache/train
test_cache_dir: null

window_seconds: 8.0
head: linear
pool: mean
freeze_encoder: true
unfreeze_top_blocks: 0

val_fraction: 0.2
group_keys: [dataset]
normalise_mode: peak
use_pos_weight: true

hard_negative_file: artifacts/runs/error_analysis_train/hard_negative_indices.npy
# 3x rather than 10x: these are the examples the model is most confident and most
# wrong about, so a heavy weight lets a handful of possibly-mislabelled clips
# dominate the gradient. Three is enough to matter and small enough to argue with.
hard_negative_repeat: 3

epochs: 8
batch_size: 32
lr: 1.0e-3
weight_decay: 0.01
seed: 1234
amp: true

fp_cost: 4.0
early_stop_patience: 3
