# E2 — window-size arm. The core latency/accuracy dial, one variable changed.
run_id: E2_w2p0
notes: "window sweep: 2.0s (E1 config otherwise unchanged)"
cache_dir: data/cache/train
# Deliberately null for the whole sweep. The winner is chosen on validation
# only; scoring all five windows on the held-out set would spend its
# independence five times over before a decision was made. The single test
# evaluation happens afterwards, on the winner, via:
#   python -m training.train --eval-only --checkpoint weights/<winner>-best.pt
test_cache_dir: null
window_seconds: 2.0
head: linear
pool: mean
freeze_encoder: true
val_fraction: 0.2
group_keys: [dataset]
normalise_mode: peak
use_pos_weight: true
epochs: 8
batch_size: 32
lr: 1.0e-3
seed: 1234
fp_cost: 4.0
