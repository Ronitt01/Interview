# E4b — pooling arm. Mean pooling dilutes evidence that lives in the last few
# hundred ms against seconds of mid-utterance. Attention pooling lets the model
# choose where to look, for ~d_model extra parameters.
run_id: E4b
notes: "attention pooling + linear — isolates pooling from head capacity"
cache_dir: data/cache/train
test_cache_dir: data/cache/test
window_seconds: 1.5
head: attn
freeze_encoder: true
val_fraction: 0.2
group_keys: [dataset]
normalise_mode: peak
use_pos_weight: true
epochs: 8
batch_size: 32
lr: 1.0e-3
seed: 1234
fp_cost: 4.0
