# E1 — the go/no-go. Frozen Whisper Tiny encoder + linear head.
#
# Gate 4: this must beat E0 and E0b on F1 *and* on false interruptions. If it
# does not, the problem is data or labels, not architecture — go back to the
# preprocessing rather than reaching for a bigger model.
run_id: E1
notes: "frozen encoder, linear head — reference architecture"

cache_dir: data/cache/train
test_cache_dir: data/cache/test

window_seconds: 8.0
head: linear
pool: mean
freeze_encoder: true
unfreeze_top_blocks: 0

val_fraction: 0.2
group_keys: [dataset]
normalise_mode: peak
use_pos_weight: true

epochs: 8
batch_size: 32
lr: 1.0e-3
weight_decay: 0.01
seed: 1234
amp: true

fp_cost: 4.0
early_stop_patience: 3
